<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 220px; /* Slightly wider to fit new button */
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin-top: 0;
      color: #2d5016;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    #open-options {
      background: #2d5016;
      color: white;
    }
    #reset-position {
      background: #f0ad4e;
      color: black;
    }
    #reset-position:hover {
      background: #ec971f;
    }
    .divider {
      height: 1px;
      background: #ddd;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <h3>Import-Dep Helper</h3>
  <p style="font-size: 11px; text-align: center; color: #666;">UI appears on registration page</p>
  
  <div class="divider"></div>
  
  <button id="reset-position">Reset position</button>
  <button id="open-options">Settings</button>
  
  <script src="popup.js"></script>
</body>
</html>
